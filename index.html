<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cadastro de Doces</title>
</head>
<body>
    <h1>Cadastro de Doces</h1>

    <form id="formulario">
        <input type="text" id="campoNome" placeholder="Nome do doce">
        <input type="text" id="campoSabor" placeholder="Sabor">
        <input type="number" id="campoPreco" placeholder="Preço">
        <button type="submit">Cadastrar</button>
    </form>

    <table>
        <thead>
            <th>Nome</th>
            <th>Sabor</th>
            <th>Preço</th>
        </thead>
        <tbody id="corpoTabela">
        </tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
